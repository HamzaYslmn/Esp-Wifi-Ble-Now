<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Esp-WiFi-BLE · Console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0e1116; color: #d7dde4;
  }
  header { padding: 18px 20px; border-bottom: 1px solid #232a33; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  h1 small { color: #6b7785; font-weight: 400; }
  main { max-width: 620px; margin: 22px auto; padding: 0 20px; }
  section { margin-bottom: 18px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  h2 small { color: #6b7785; font-weight: 400; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    font: inherit; background: #0e1116; color: #d7dde4;
    border: 1px solid #2f3947; border-radius: 6px; padding: 8px 11px;
  }
  input:focus { outline: none; border-color: #2563eb; }
  #ip  { width: 230px; }
  #wifi-msg, #ble-msg { flex: 1; min-width: 150px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid #2f3947;
    background: #1a212b; color: #d7dde4; padding: 8px 14px; border-radius: 6px;
  }
  button:hover:not(:disabled) { background: #232c38; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  #status { color: #6b7785; font-size: 13px; margin-top: 6px; min-height: 1.3em; }
  #log {
    margin-top: 6px; padding: 12px 14px; height: 300px; overflow-y: auto;
    border: 1px solid #232a33; border-radius: 8px; background: #141a22;
    white-space: pre-wrap; word-break: break-word; font-size: 13px;
  }
  #log .rx  { color: #d7dde4; }
  #log .tx  { color: #5fa8ff; }
  #log .sys { color: #6b7785; }
  #log .err { color: #f3a0a0; }
  #log time { color: #4b5563; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <h1>Esp-WiFi-BLE · Console <small>— BLE + Wi-Fi at the same time</small></h1>
</header>
<main>
  <section>
    <h2>BLE <small>— connect over Web Bluetooth, watch peer broadcasts, send messages</small></h2>
    <form id="ble-form">
      <button id="ble-connect" type="button" class="primary">Connect over BLE</button>
      <input id="ble-msg" type="text" placeholder="message over BLE…" maxlength="240" autocomplete="off" disabled />
      <button id="ble-send" type="submit" disabled>Send</button>
    </form>
  </section>
  <section>
    <h2>Wi-Fi <small>— GET /message?msg=…</small></h2>
    <form id="wifi-form">
      <input id="ip" type="text" placeholder="ESP32 IP, e.g. 192.168.1.101" autocomplete="off" />
      <input id="wifi-msg" type="text" placeholder="message over Wi-Fi…" maxlength="240" autocomplete="off" />
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
  <div id="status">Serve over <b>http://localhost</b>. Chrome may show a Private Network Access prompt for Wi-Fi — accept it.</div>
  <div id="log"></div>
</main>

<script>
// MARK: NUS UUIDs - must match src/EspWB_BLE.cpp.
const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // browser -> ESP32
const NUS_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // ESP32 -> browser

const logEl = document.getElementById('log');
function log(kind, text) {
  const line = document.createElement('div');
  line.className = kind;
  line.innerHTML = `<time>${new Date().toLocaleTimeString()}</time>` +
    text.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  logEl.appendChild(line);
  if (logEl.childElementCount > 200) logEl.firstElementChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}

// MARK: BLE
const bleConnectBtn = document.getElementById('ble-connect');
const bleForm       = document.getElementById('ble-form');
const bleMsg        = document.getElementById('ble-msg');
const bleSend       = document.getElementById('ble-send');
let bleRxChar = null;
const lastMs  = new Map();

if (!navigator.bluetooth) {
  bleConnectBtn.disabled = true;
  log('err', 'this browser has no Web Bluetooth — use Chrome/Edge on desktop or Android');
}

bleConnectBtn.addEventListener('click', async () => {
  let device;
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS_SERVICE] }],          // any device advertising NUS
    });
  } catch (e) {
    if (e.name !== 'NotFoundError') log('err', 'BLE: ' + e.message);
    return;
  }
  try {
    const server = await device.gatt.connect();
    const svc    = await server.getPrimaryService(NUS_SERVICE);
    const txChar = await svc.getCharacteristic(NUS_TX);
    bleRxChar    = await svc.getCharacteristic(NUS_RX);

    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', (ev) => {
      // Relay line: "<mac> <senderMs> <payload>" - dedupe by senderMs.
      const text = new TextDecoder().decode(ev.target.value).trim();
      const sp1 = text.indexOf(' '), sp2 = text.indexOf(' ', sp1 + 1);
      if (sp2 < 0) { log('rx', text); return; }
      const mac = text.slice(0, sp1), senderMs = text.slice(sp1 + 1, sp2);
      if (lastMs.get(mac) === senderMs) return;
      lastMs.set(mac, senderMs);
      log('rx', `${mac}  ->  ${text.slice(sp2 + 1)}`);
    });

    bleMsg.disabled = bleSend.disabled = false;
    bleConnectBtn.textContent = 'BLE connected — ' + (device.name || device.id);
    bleConnectBtn.disabled = true;
    log('sys', 'BLE connected');

    device.addEventListener('gattserverdisconnected', () => {
      bleRxChar = null;
      bleMsg.disabled = bleSend.disabled = true;
      bleConnectBtn.textContent = 'Connect over BLE';
      bleConnectBtn.disabled = false;
      log('sys', 'BLE disconnected');
    });
  } catch (e) {
    log('err', 'BLE connect failed: ' + e.message);
  }
});

bleForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = bleMsg.value.trim();
  if (!msg || !bleRxChar) return;
  try {
    await bleRxChar.writeValueWithoutResponse(new TextEncoder().encode(msg));
    log('tx', `BLE  ->  ${msg}`);
    bleMsg.value = '';
  } catch (err) {
    log('err', 'BLE send failed: ' + err.message);
  }
});

// MARK: Wi-Fi - simple GET, no preflight
const wifiForm = document.getElementById('wifi-form');
const ipEl     = document.getElementById('ip');
const wifiMsg  = document.getElementById('wifi-msg');

ipEl.value = localStorage.getItem('espwb-ip') || '';

wifiForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const ip = ipEl.value.trim(), msg = wifiMsg.value.trim();
  if (!ip || !msg) return;
  try {
    const res = await fetch(`http://${ip}/message?msg=${encodeURIComponent(msg)}`);
    if (res.ok) {
      localStorage.setItem('espwb-ip', ip);
      log('tx', `Wi-Fi  ->  ${ip}  ${msg}`);
      wifiMsg.value = '';
    } else {
      log('err', `${ip} replied HTTP ${res.status}`);
    }
  } catch (err) {
    log('err', `failed to reach ${ip} — same network? accepted PNA prompt?`);
  }
});
</script>
</body>
</html>
